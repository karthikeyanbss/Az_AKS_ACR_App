apiVersion: apps/v1
kind: Deployment
metadata:
  name: py-http-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: py-http-test
  template:
    metadata:
      labels:
        app: py-http-test
    spec:
      containers:
        - name: python-http
          image: python:3.11-slim
          command: ["python", "-m", "http.server", "8080"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: py-http-test
spec:
  selector:
    app: py-http-test
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
